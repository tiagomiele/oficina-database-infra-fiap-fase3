name: CI

on:
  pull_request:
  push:
    branches: [main, homolog]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate required documentation
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/data-model.md
          test -f docs/aws-academy.md
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        run: |
          if find . -name '*.tf' -print -quit | grep -q .; then
            terraform fmt -check -recursive
          else
            echo 'Terraform files will be added in Week 2.'
          fi
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
