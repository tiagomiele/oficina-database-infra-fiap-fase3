name: CI

on:
  pull_request:
  push:
    branches: [main, homolog]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required documentation
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/data-model.md
          test -f docs/aws-academy.md
          test -f docs/hcp-terraform.md

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init without remote backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Validate example variable names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = set(
              re.findall(
                  r'^variable\s+"([a-zA-Z0-9_]+)"',
                  Path('variables.tf').read_text(encoding='utf-8'),
                  re.MULTILINE,
              )
          )

          for path in Path('environments').glob('*.tfvars.example'):
              assigned = set(
                  re.findall(
                      r'^([a-zA-Z_][a-zA-Z0-9_]*)\s*=',
                      path.read_text(encoding='utf-8'),
                      re.MULTILINE,
                  )
              )
              unknown = sorted(assigned - variables)
              if unknown:
                  raise SystemExit(f'{path}: undeclared variables: {unknown}')
          PY

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: tflint --recursive

      - name: Trivy infrastructure scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
