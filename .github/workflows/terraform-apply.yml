name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: HCP Terraform workspace environment
        required: true
        default: homolog
        type: choice
        options:
          - homolog
          - production
      action:
        description: Operação a executar
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy
      confirm:
        description: Digite APPLY-<ambiente> ou DESTROY-<ambiente> para confirmar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate (${{ inputs.action }} ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENABLE_TERRAFORM_APPLY: ${{ vars.ENABLE_TERRAFORM_APPLY }}
      EXPECTED_CONFIRMATION: ${{ inputs.action == 'apply' && format('APPLY-{0}', inputs.environment) || format('DESTROY-{0}', inputs.environment) }}
      PROVIDED_CONFIRMATION: ${{ inputs.confirm }}
    steps:
      - name: Require explicit enable flag
        run: |
          if [ "$ENABLE_TERRAFORM_APPLY" != "true" ]; then
            echo "::error::A variable ENABLE_TERRAFORM_APPLY do ambiente ${{ inputs.environment }} precisa valer 'true' para executar ${{ inputs.action }}."
            exit 1
          fi

      - name: Require typed confirmation
        run: |
          if [ "$PROVIDED_CONFIRMATION" != "$EXPECTED_CONFIRMATION" ]; then
            echo "::error::Confirmação inválida. Era esperado exatamente '$EXPECTED_CONFIRMATION'."
            exit 1
          fi

  terraform:
    name: Terraform ${{ inputs.action }} (${{ inputs.environment }})
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ inputs.environment == 'homolog' && vars.TF_WORKSPACE_HOMOLOG || vars.TF_WORKSPACE_PRODUCTION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS Academy credentials
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name ausente no ambiente ${{ inputs.environment }}. Renove as credenciais do Learner Lab."
              exit 1
            fi
          done

          if ! output=$(aws sts get-caller-identity --output json 2>&1); then
            echo "$output"
            if echo "$output" | grep -qi 'ExpiredToken'; then
              echo "::error::Credenciais do AWS Academy expiradas. Inicie o Learner Lab e atualize os três secrets."
            else
              echo "::error::aws sts get-caller-identity falhou. Verifique as credenciais temporárias."
            fi
            exit 1
          fi
          echo "$output" | jq -r '"Conta: \(.Account)  Identidade: \(.Arn)"'

      - name: Validate HCP configuration
        run: |
          test -n "$TF_CLOUD_ORGANIZATION" || { echo "::error::variable TF_CLOUD_ORGANIZATION ausente."; exit 1; }
          test -n "$TF_WORKSPACE" || { echo "::error::variable do workspace HCP ausente para ${{ inputs.environment }}."; exit 1; }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -no-color
          else
            terraform plan -input=false -no-color
          fi

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve -no-color

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -no-color

      - name: Outputs sem credenciais
        run: terraform output -no-color
